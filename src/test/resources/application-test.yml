# Dedicated isolated test configuration (V3-25, requirement §2.4c): guarantees the test suite
# never reaches the real external systems or a real / working database. Activated for EVERY test
# run via the `test` Spring profile, which the Surefire plugin turns on in pom.xml — so CI's
# `mvn clean verify` uses it automatically (no workflow change needed).
#
# This file is the dedicated test profile. As defence-in-depth, pom.xml ALSO pins the datasource
# and bootstrap env vars as JVM system properties, which outrank OS environment variables
# (DB_URL_OPERATIONAL / DB_URL_CONFIG / TICKETING_BOOTSTRAP_DATASET), so isolation holds even
# when those are exported locally. See README "Testing".
spring:
  datasource:
    operational:
      url: jdbc:h2:mem:ticketing-test-op;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=false
      driver-class-name: org.h2.Driver
      username: sa
      password:
    config:
      url: jdbc:h2:mem:ticketing-test-cfg;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=false
      driver-class-name: org.h2.Driver
      username: sa
      password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

ticketing:
  persistence: memory
  bootstrap:
    dataset: none
    clear-db-on-start: false
  # Base url is inherited from application.yml so HttpPaymentGateway is used in tests
  # external:
  #   base-url:
